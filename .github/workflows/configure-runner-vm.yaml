name: 'Configure Runner VM'

# Provisions and configures the GitHub Actions runner VM
# Services managed: DinD runners, container registry, web server (nginx), Gitea

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Explicit execution profile under environments/'
        required: true
        type: string
      project_contract:
        description: 'Optional generated project metadata.yaml already staged by the owning pipeline'
        required: false
        type: string
      tags:
        description: 'Ansible tags to run (e.g., runner, tools, gitea, registry, webserver, rustfs, health, all)'
        required: false
        default: 'all'
        type: string
      smoke_test_rustfs:
        description: 'Run RustFS S3 write/read/delete smoke test after configuration'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  configure:
    name: 'Run Ansible Playbook'
    runs-on: ${{ fromJSON(vars.RUNNER_MAINTENANCE_LABELS || vars.RUNNER_LABELS) }}
    container:
      image: ${{ vars.RUNNER_CONTAINER_IMAGE }}

    env:
      PRE_SUPPLIED_RUNNER_TOKEN: ${{ secrets.RUNNER_REGISTRATION_TOKEN }}
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Load explicit execution profile
      id: profile
      env:
        PROFILE_NAME: ${{ inputs.environment }}
        PROJECT_CONTRACT: ${{ inputs.project_contract }}
      run: |
        python3 - <<'PYTHON'
        import os,re,yaml
        from pathlib import Path
        name=os.environ['PROFILE_NAME']
        if not re.fullmatch(r'[A-Za-z0-9_-]+',name):raise SystemExit('invalid environment profile')
        p=Path('environments')/name/'group_vars.yml';d=yaml.safe_load(p.read_text())
        owner=d['github_org'];repo=d['github_repository'];scope=d['runner_scope']
        if not all(re.fullmatch(r'[A-Za-z0-9_.-]+',v) for v in [owner,repo]) or scope not in ['repo','org']:raise SystemExit('invalid runner registration profile')
        endpoint=f"repos/{owner}/{repo}/actions/runners" if scope=='repo' else f"orgs/{owner}/actions/runners"
        s3_url=d['rustfs_endpoint_url'];s3_bucket=d['rustfs_bucket']
        if os.environ.get('PROJECT_CONTRACT'):
          contract=yaml.safe_load(Path(os.environ['PROJECT_CONTRACT']).read_text())
          if 'objectStore' in contract['platformServices']:
            s3_url=contract['platformServices']['objectStore']['endpoint'];s3_bucket=contract['platformServices']['objectStore']['bucket']
        if any('\n' in v or '\r' in v for v in [s3_url,s3_bucket]):raise SystemExit('invalid output value')
        with open(os.environ['GITHUB_OUTPUT'],'a') as f:
          f.write(f"runner_api={endpoint}\ns3_url={s3_url}\ns3_bucket={s3_bucket}\n")
        PYTHON

    - name: Validate selected private service references
      id: runtime-refs
      shell: bash
      env:
        SELECTED_TAGS: ${{ inputs.tags }}
        JUMP_HOST_SSH_KEY: ${{ secrets.JUMP_HOST_SSH_KEY }}
        JUMP_HOST_KNOWN_HOSTS: ${{ secrets.JUMP_HOST_KNOWN_HOSTS }}
        HTTP_SERVER_PASSWORD: ${{ secrets.HTTP_SERVER_PASSWORD }}
        GITEA_ADMIN_PASSWORD: ${{ secrets.GITEA_ADMIN_PASSWORD }}
      run: |
        set -euo pipefail
        python3 scripts/validate-runner-configuration.py

    - name: Generate Runner Token
      if: env.PRE_SUPPLIED_RUNNER_TOKEN == '' && steps.runtime-refs.outputs.runner_selected == 'true'
      id: token
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        TOKEN=$(gh api -X POST "${{ steps.profile.outputs.runner_api }}/registration-token" --jq '.token')
        echo "::add-mask::$TOKEN"
        echo "runner_token=$TOKEN" >> $GITHUB_OUTPUT

    - name: Configure SSH for Ansible
      shell: bash
      env:
        JUMP_HOST_SSH_KEY: ${{ secrets.JUMP_HOST_SSH_KEY }}
        JUMP_HOST_KNOWN_HOSTS: ${{ secrets.JUMP_HOST_KNOWN_HOSTS }}
      run: |
        set -euo pipefail
        if [ -z "${JUMP_HOST_SSH_KEY:-}" ] || [ -z "${JUMP_HOST_KNOWN_HOSTS:-}" ]; then
          echo "::error::JUMP_HOST_SSH_KEY and JUMP_HOST_KNOWN_HOSTS are required"
          exit 1
        fi
        key_dir=$(mktemp -d "$RUNNER_TEMP/runner-ssh.XXXXXX")
        trap 'rm -rf -- "$key_dir"' ERR
        chmod 700 "$key_dir"
        printf '%s\n' "$JUMP_HOST_SSH_KEY" > "$key_dir/id_rsa"
        chmod 600 "$key_dir/id_rsa"
        printf '%s\n' "$JUMP_HOST_KNOWN_HOSTS" > "$key_dir/known_hosts"
        chmod 600 "$key_dir/known_hosts"
        ssh-keygen -l -f "$key_dir/known_hosts" >/dev/null
        echo "ANSIBLE_SSH_COMMON_ARGS=-o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$key_dir/known_hosts" >> "$GITHUB_ENV"
        echo "RUNNER_SSH_DIR=$key_dir" >> "$GITHUB_ENV"
        echo "ANSIBLE_PRIVATE_KEY_FILE=$key_dir/id_rsa" >> "$GITHUB_ENV"

    - name: Run Ansible Playbook
      shell: bash
      env:
        ANSIBLE_HOST_KEY_CHECKING: 'true'
        HTTP_SERVER_PASSWORD: ${{ secrets.HTTP_SERVER_PASSWORD }}
        GITEA_ADMIN_PASSWORD: ${{ secrets.GITEA_ADMIN_PASSWORD }}
        RUNNER_TOKEN: ${{ secrets.RUNNER_REGISTRATION_TOKEN || steps.token.outputs.runner_token }}
        PROFILE_NAME: ${{ inputs.environment }}
        PROJECT_CONTRACT: ${{ inputs.project_contract }}
        RUN_TAGS: ${{ inputs.tags }}
        RUSTFS_ACCESS_KEY: ${{ secrets.RUSTFS_ACCESS_KEY }}
        RUSTFS_SECRET_KEY: ${{ secrets.RUSTFS_SECRET_KEY }}
      run: |
        args=(-i "environments/$PROFILE_NAME/hosts.ini" "ansible/playbooks/configure-runner.yaml" -e "env=$PROFILE_NAME" --tags "$RUN_TAGS")
        if [ -n "$PROJECT_CONTRACT" ]; then
          test -f "$PROJECT_CONTRACT"
          args+=(-e "project_contract_file=$(realpath "$PROJECT_CONTRACT")")
        fi
        ansible-playbook "${args[@]}"

    - name: Smoke Test RustFS
      if: inputs.smoke_test_rustfs && (contains(inputs.tags, 'rustfs') || inputs.tags == 'all')
      shell: bash
      env:
        AWS_ACCESS_KEY_ID: ${{ secrets.RUSTFS_ACCESS_KEY }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.RUSTFS_SECRET_KEY }}
        AWS_DEFAULT_REGION: us-east-1
      run: |
        set -euo pipefail
        key="smoke/github-actions-${GITHUB_RUN_ID}.txt"
        payload="rustfs smoke test ${GITHUB_RUN_ID}"
        printf '%s' "${payload}" | aws --endpoint-url ${{ steps.profile.outputs.s3_url }} s3 cp - "s3://${{ steps.profile.outputs.s3_bucket }}/${key}"
        actual=$(aws --endpoint-url ${{ steps.profile.outputs.s3_url }} s3 cp "s3://${{ steps.profile.outputs.s3_bucket }}/${key}" -)
        test "${actual}" = "${payload}"
        aws --endpoint-url ${{ steps.profile.outputs.s3_url }} s3 rm "s3://${{ steps.profile.outputs.s3_bucket }}/${key}"

    - name: Verify Runners
      if: steps.runtime-refs.outputs.runner_selected == 'true'
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        echo "Checking runner status..."
        gh api ${{ steps.profile.outputs.runner_api }} --jq '.runners[] | "\(.name): \(.status)"'

    - name: Summary
      if: always()
      run: |
        echo "## Runner VM Configuration" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Tags:** ${{ inputs.tags }}" >> $GITHUB_STEP_SUMMARY
        echo "**Status:** ${{ job.status }}" >> $GITHUB_STEP_SUMMARY

    - name: Remove private temporary SSH key
      if: ${{ always() }}
      shell: bash
      run: |
        set -euo pipefail
        if [ -n "${RUNNER_SSH_DIR:-}" ]; then
          rm -rf -- "$RUNNER_SSH_DIR"
        fi
