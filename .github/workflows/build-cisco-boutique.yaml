# Build Cisco Boutique Demo Images for amd64
# Source: https://github.com/nvibert/cisco-microservices-demo
name: Build Cisco Boutique Images

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Image tag (e.g., amd64-v1)'
        required: true
        default: 'amd64-v1'
      dry_run:
        description: 'Dry run (build but do not push)'
        type: boolean
        default: false

env:
  REGISTRY: registry.example.com:5000
  IMAGE_PREFIX: cisco-boutique

jobs:
  build:
    runs-on: ${{ fromJSON(vars.RUNNER_LABELS) }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: emailservice
            context: src/emailservice
          - service: productcatalogservice
            context: src/productcatalogservice
          - service: recommendationservice
            context: src/recommendationservice
          - service: shippingservice
            context: src/shippingservice
          - service: checkoutservice
            context: src/checkoutservice
          - service: paymentservice
            context: src/paymentservice
          - service: currencyservice
            context: src/currencyservice
          - service: cartservice
            context: src/cartservice/src
          - service: frontend
            context: src/frontend
          - service: adservice
            context: src/adservice
          - service: loadgenerator
            context: src/loadgenerator

    steps:
      - name: Checkout cisco-microservices-demo
        uses: actions/checkout@v4
        with:
          repository: nvibert/cisco-microservices-demo
          ref: main

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: |
            network=host
          buildkitd-config-inline: |
            [registry."registry.example.com:5000"]
              insecure = true

      - name: Build and push ${{ matrix.service }}
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          push: ${{ !inputs.dry_run }}
          platforms: linux/amd64
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.service }}:${{ inputs.image_tag }}
          # Use host network to allow build containers to reach external repos
          network: host
          # Disable GHA cache (not available on the selected runners without config)
          no-cache: true

  summary:
    runs-on: ${{ fromJSON(vars.RUNNER_LABELS) }}
    needs: build
    if: always()
    steps:
      - name: Build Summary
        run: |
          echo "## Cisco Boutique Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Tag:** ${{ inputs.image_tag }}" >> $GITHUB_STEP_SUMMARY
          echo "**Registry:** ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}" >> $GITHUB_STEP_SUMMARY
          echo "**Dry Run:** ${{ inputs.dry_run }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Images Built" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          for svc in emailservice productcatalogservice recommendationservice shippingservice checkoutservice paymentservice currencyservice cartservice frontend adservice loadgenerator; do
            echo "${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${svc}:${{ inputs.image_tag }}"
          done >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
