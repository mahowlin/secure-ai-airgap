#------------------------------------------------------------------------------
# Other Images - NVIDIA, support tools, and demo images
#------------------------------------------------------------------------------
# Split config for parallel mirroring. See images-list.yaml for full config.
# Isovalent images are mirrored by isovalent-images.yaml.
# Estimated time: ~13 min
#------------------------------------------------------------------------------

apiVersion: mirror.openshift.io/v2alpha1
kind: ImageSetConfiguration
mirror:
  operators:
    # Certified Operators (from certified-operator-index)
    - catalog: registry.redhat.io/redhat/certified-operator-index:v4.19
      packages:
        # NVIDIA GPU Operator - For L40S GPU support
        - name: gpu-operator-certified
          defaultChannel: v25.10
          channels:
            - name: v25.10

        # NVIDIA NIM Operator - For LLM inference (NIMCache, NIMService CRDs)
        - name: nvidia-nim-operator
          channels:
            - name: stable

  additionalImages:
    # Altinity ClickHouse Operator v0.25.4
    - name: docker.io/altinity/clickhouse-operator:0.25.4
    - name: docker.io/altinity/metrics-exporter:0.25.4

    # Splunk OTel Collector
    - name: quay.io/signalfx/splunk-otel-collector:0.143.0

    # Intersight OTEL Collector - UCS Metrics
    - name: ghcr.io/cgascoig/intersight-otel:v0.1.2
    - name: docker.io/otel/opentelemetry-collector-contrib:0.96.0

    # Validation/Debugging Tools
    - name: registry.redhat.io/openshift4/ose-tools-rhel9:latest

    # Sealed Secrets Controller - Pure GitOps secrets management
    - name: docker.io/bitnami/sealed-secrets-controller:0.27.3

    # GPU Test Images
    - name: nvcr.io/nvidia/cuda:12.0.0-base-ubuntu20.04
    - name: nvcr.io/nvidia/cuda:12.0.0-devel-ubuntu20.04

    # NVIDIA NIM Operator - Helm-based deployment
    - name: nvcr.io/nvidia/cloud-native/k8s-nim-operator:v3.0.2

    # Cisco Boutique Demo
    - name: us-docker.pkg.dev/gcp-cpagcpdemosdwan-nprd-95534/microservices-demo/frontend:102325-1
    - name: us-docker.pkg.dev/gcp-cpagcpdemosdwan-nprd-95534/microservices-demo/cartservice:102325-1
    - name: us-docker.pkg.dev/gcp-cpagcpdemosdwan-nprd-95534/microservices-demo/productcatalogservice:102325-1
    - name: us-docker.pkg.dev/gcp-cpagcpdemosdwan-nprd-95534/microservices-demo/currencyservice:102325-1
    - name: us-docker.pkg.dev/gcp-cpagcpdemosdwan-nprd-95534/microservices-demo/paymentservice:102325-1
    - name: us-docker.pkg.dev/gcp-cpagcpdemosdwan-nprd-95534/microservices-demo/shippingservice:102325-1
    - name: us-docker.pkg.dev/gcp-cpagcpdemosdwan-nprd-95534/microservices-demo/emailservice:102325-1
    - name: us-docker.pkg.dev/gcp-cpagcpdemosdwan-nprd-95534/microservices-demo/checkoutservice:102325-1
    - name: us-docker.pkg.dev/gcp-cpagcpdemosdwan-nprd-95534/microservices-demo/recommendationservice:102325-1
    - name: us-docker.pkg.dev/gcp-cpagcpdemosdwan-nprd-95534/microservices-demo/adservice:102325-1
    - name: us-docker.pkg.dev/gcp-cpagcpdemosdwan-nprd-95534/microservices-demo/loadgenerator:102325-1
    - name: docker.io/redis:alpine
