#------------------------------------------------------------------------------
# Platform Images - OpenShift Release Images Only
#------------------------------------------------------------------------------
# Split config for parallel mirroring. See images-list.yaml for full config.
# Estimated time: ~11 min
#------------------------------------------------------------------------------

apiVersion: mirror.openshift.io/v2alpha1
kind: ImageSetConfiguration
mirror:
  platform:
    channels:
      - name: stable-4.19
        minVersion: 4.19.21
        maxVersion: 4.19.21
        type: ocp
    kubeVirtContainer: true  # RHCOS container disk for KubeVirt HCP provider (oc-mirror v2)
    graph: true
